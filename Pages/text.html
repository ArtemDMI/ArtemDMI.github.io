<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Текст</title>
    <style>
        body {
            background: #0f0f0f;
            color: #c8c8c8;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px 20px 48px;
        }
        textarea, input, select, button {
            font: inherit;
            color: #e4e4e4;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
        }
        #box {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 4.6em;
            padding: 10px;
            resize: vertical;
            font-size: 16px;
        }
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: 12px 0 20px;
        }
        .tools button {
            padding: 6px 12px;
            cursor: pointer;
        }
        .tools label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #size {
            width: 64px;
            padding: 6px;
        }
        #model {
            max-width: 100%;
            padding: 6px;
        }
        #list {
            font-size: 14px;
            line-height: 1.45;
        }
        .block {
            margin: 0;
        }
        /* Вся строка — кнопка на ширину списка: пустое место по бокам текста тоже шлёт перевод. */
        .src {
            position: relative;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0.45em 0.75em;
            border: 0;
            border-radius: 0;
            color: #c8c8c8;
            text-align: left;
            white-space: normal;
            overflow-wrap: anywhere;
            overflow: hidden;
            cursor: pointer;
        }
        /* Зебра: иначе у короткой строки не видно, куда жать рядом с текстом. */
        .pack > .block:nth-child(even) > .src {
            background: #0f0f0f;
        }
        .pack > .block:nth-child(odd) > .src {
            background: #242424;
        }
        .src.on {
            cursor: wait;
        }
        .src.on::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            height: 2px;
            width: 20%;
            background: #f2f2f2;
            animation: ride 0.75s ease-in-out infinite alternate;
        }
        .pack > .block > .src.bad {
            background: #8f2424;
            color: #fff;
        }
        /* Не кнопка: тот же серый текст, фон только чуть зеленит, чтобы ответ отличался от строки. */
        .tr {
            box-sizing: border-box;
            width: 100%;
            margin: 0;
            padding: 0.45em 0.75em;
            text-align: left;
            color: #c8c8c8;
            background: #1a3026;
            overflow-wrap: anywhere;
        }
        .tr:empty {
            display: none;
        }
        .pack + .pack {
            margin-top: 1.25em;
            padding-top: 0.35em;
            border-top: 1px solid #2c2c2c;
        }
        .midbox {
            margin: 0.75em 0;
        }
        .mid {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0.55em 0.85em;
            cursor: pointer;
        }
        .mid.on {
            cursor: wait;
            border-color: #f2f2f2;
        }
        .bar {
            display: none;
            height: 2px;
            margin-top: 3px;
            overflow: hidden;
        }
        .mid.on + .bar {
            display: block;
        }
        .bar span {
            display: block;
            height: 2px;
            width: 20%;
            background: #f2f2f2;
            animation: ride 0.75s ease-in-out infinite alternate;
        }
        @keyframes ride {
            from { transform: translateX(0); }
            to { transform: translateX(400%); }
        }
        .mid.ok {
            background: #1b5e34;
            border-color: #2f9d55;
            color: #eafff0;
        }
        .mid.bad {
            background: #8f2424;
            border-color: #e05a5a;
            color: #fff;
        }
    </style>
</head>
<body>
    <textarea id="box" rows="3"></textarea>
    <div class="tools">
        <button type="button" id="build">Сгенерировать</button>
        <button type="button" id="wipe">Сброс</button>
        <label>шрифт <input id="size" type="number" min="8" max="72" value="14"></label>
        <select id="model">
            <option>deepseek/deepseek-v4.1-flash</option>
            <option>google/gemini-3.8-flash</option>
            <option>z-ai/glm-5.3-flash</option>
            <option>z-ai/glm-5.3</option>
            <option>z-ai/glm-5.2</option>
            <option>xiaomi/mimo-v2.6-flash</option>
        </select>
    </div>
    <div id="list"></div>
    <script>
        const box = document.getElementById("box");
        const list = document.getElementById("list");
        const size = document.getElementById("size");
        const model = document.getElementById("model");

        const u3 = "v1";
        const u1 = "sk";
        const u2 = "or";
        const mix = "fbcecbbacacedfbdceaaaccbce";
        const lane = "87545756576331423248371148993192054996";
        const marks = "bbababbaabbbabbabaabbbbbbbbaabbbbabaabbaaaabababbbbaabbabbbaaaab";

        const ha = "ope";
        const hb = "nrou";
        const hc = "ter.ai";
        const pa = "/ap";
        const pb = "i/v1/";
        const pc = "cha";
        const pd = "t/comple";
        const pe = "tions";

        function material() {
            let li = 0;
            let di = 0;
            let body = "";
            for (const m of marks) {
                if (m === "a") body += mix[li++];
                else body += String((Number(lane[di++]) + 4) % 10);
            }
            return [u1, u2, u3].join("-") + "-" + body;
        }

        function endpoint() {
            return "https://" + ha + hb + hc + pa + pb + pc + pd + pe;
        }

        function longWords(s) {
            let n = 0;
            for (const w of s.split(/\s+/)) {
                const letters = w.match(/\p{L}/gu);
                if (letters && letters.length >= 3) n += 1;
            }
            return n;
        }

        function splitSentences(text) {
            const out = [];
            for (const line of text.replace(/\r\n/g, "\n").split(/\n+/)) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                for (const bit of trimmed.split(/(?<=[.!?…])\s+/)) {
                    const s = bit.trim();
                    if (!s) continue;
                    for (const piece of breakUnpunctuated(s)) out.push(piece);
                }
            }
            return out;
        }

        // Сырой текст без знаков иначе остаётся одной кнопкой на весь абзац.
        function breakUnpunctuated(s) {
            const limit = 400;
            if (s.length <= limit || /[.,!?;:…—]/.test(s)) return [s];
            const words = s.split(/\s+/).filter(Boolean);
            const rows = [];
            let cur = "";
            for (const w of words) {
                if (!cur) {
                    cur = w;
                    continue;
                }
                if (cur.length + 1 + w.length > limit) {
                    rows.push(cur);
                    cur = w;
                } else {
                    cur += " " + w;
                }
            }
            if (cur) rows.push(cur);
            return rows;
        }

        // Короткий хвост не остаётся отдельной кнопкой: в строке должно набраться несколько длинных слов.
        function groupSentences(items) {
            const min = 7;
            const rows = [];
            let bucket = [];
            for (const item of items) {
                if (bucket.length && longWords(bucket.join(" ")) >= min) {
                    rows.push(bucket.join(" "));
                    bucket = [];
                }
                bucket.push(item);
            }
            if (!bucket.length) return rows;
            if (rows.length && longWords(bucket.join(" ")) < min) rows[rows.length - 1] += " " + bucket.join(" ");
            else rows.push(bucket.join(" "));
            return rows;
        }

        function applySize() {
            const n = Number(size.value);
            if (n > 0) list.style.fontSize = n + "px";
        }

        function lineBlock(text) {
            const block = document.createElement("div");
            block.className = "block";
            const src = document.createElement("button");
            src.type = "button";
            src.className = "src";
            src.textContent = text;
            src.addEventListener("click", () => send(block));
            const tr = document.createElement("div");
            tr.className = "tr";
            // Пустой ответ скрыт, а с текстом оказывается над строкой, а не под ней.
            block.append(tr, src);
            return block;
        }

        function midButton(pack) {
            const wrap = document.createElement("div");
            wrap.className = "midbox";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "mid";
            btn.textContent = "упростить";
            btn.addEventListener("click", () => adapt(pack));
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.append(document.createElement("span"));
            wrap.append(btn, bar);
            return wrap;
        }

        // «Упростить» перед пачкой: вторая пачка и её кнопка только когда строк больше 30.
        function fillPack(pack, rows) {
            pack.replaceChildren();
            pack.append(midButton(pack));
            for (const text of rows) pack.append(lineBlock(text));
        }

        function render(rows) {
            list.replaceChildren();
            for (let i = 0; i < rows.length; i += 30) {
                const pack = document.createElement("div");
                pack.className = "pack";
                fillPack(pack, rows.slice(i, i + 30));
                list.append(pack);
            }
        }

        function prior(block) {
            const blocks = [...list.querySelectorAll(".block")];
            const at = blocks.indexOf(block);
            return blocks.slice(Math.max(0, at - 5), at).map((item) => item.querySelector(".src").textContent).join("\n");
        }

        function readAnswer(data) {
            const msg = data && data.choices && data.choices[0] && data.choices[0].message;
            if (!msg) return "";
            const content = msg.content;
            if (typeof content === "string") return content.trim();
            if (Array.isArray(content)) {
                return content.map((part) => (typeof part === "string" ? part : (part && part.text) || "")).join("").trim();
            }
            return "";
        }

        async function post(messages, signal) {
            const res = await fetch(endpoint(), {
                method: "POST",
                signal,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bea" + "rer " + material()
                },
                body: JSON.stringify({
                    model: model.value,
                    messages,
                    reasoning: { effort: "low" }
                })
            });
            const raw = await res.text();
            if (!res.ok) throw new Error("bad");
            const answer = readAnswer(JSON.parse(raw));
            if (!answer) throw new Error("empty");
            return answer;
        }

        async function pull(block, signal) {
            const task = [
                "Вот предыдущий контекст:",
                prior(block),
                "Вот твоя задача:",
                "Переведи на английский язык только с заменой слов и выражений на эквиваленты уровня знаний языка B2. Заменяй книжные глаголы, слова и формулировки на современные разговорные простые или фразовые глаголы и слова. Ответ должен звучать как будто два приятеля простым языком рассказывают текст в кафе за чашкой кофе. Твой ответ должен состоять только из переведенного английского текста, без заголовков.",
                "",
                "Вот текст для твоего перевода:",
                block.querySelector(".src").textContent
            ].join("\n");
            return post([
                { role: "system", content: "Роль - ты переводчик с русского на английский язык" },
                { role: "user", content: task }
            ], signal);
        }

        function shapeTask(text) {
            const sample = [
                "Мужчину начали терзать сомнения, однако вскоре он сдался, переоделся, надел маску и перчатки и уже собрался выходить из квартиры, как тут же решил снять маску и выбросил её в мусорное ведро. Объяснения своему поступку мужчина найти не смог. Он просто был уверен, что так будет лучше.",
                "Женщина ждала его на ступеньках возле парадного входа в библиотеку. Одета она, как и всегда, была не по погоде и даже слегка дрожала от холода. Сама женщина, однако, находила эту дрожь вполне нормальной. Завидев мужчину, она опустила наушники на шею и слегка подняла руку."
            ].join("\n");
            const before = "Но мы согласны на ваше предложение — вернём подписной бонус в обмен на файлы». На камерах я видел, как секспот развернулся и ушёл из общественной зоны через тоннель прямо за спиной. Тлейси сказала: «Весь бонус? » Она явно не ожидала, что они согласятся.";
            const after = "Мы согласны на ваше предложение. Мы вернём подписной бонус в обмен на файлы. Я видел на камерах, как Секспот развернулся и ушёл из общественной зоны через тоннель прямо за спиной. Тлейси сказала: «Весь бонус?» Она явно не ожидала, что они согласятся.";
            return [
                "Правила:",
                "- Сохраняй все детали и факты. Не выкидывай информацию и не пересказывай короче.",
                "- Книжные формулировки, метафоры и иносказания заменяй прямыми словами, как в новелле.",
                "- Прямой порядок слов: сначала подлежащее, потом сказуемое, потом остальное.",
                "- Фразу из трёх и более частей разбивай на короткие. Две части можно оставить.",
                "- Язык B2 для подростка: без сложных конструкций, но не для новичка.",
                "- Убирай мусор: тайминги, бесполезные цифры, ники, разметку сайтов и прочий сор. Факты истории оставляй.",
                "- Следи за пунктуацией и форматированием. Если они сломаны — исправь.",
                "- В ответе только готовый текст, без пояснений.",
                "",
                "Пример стиля:",
                sample,
                "",
                "Пример переделки:",
                "Было: " + before,
                "Стало: " + after,
                "",
                "Выведи примерно в таком же виде.",
                "",
                "Вот то, что нужно перевести/адаптировать:",
                text
            ].join("\n");
        }

        async function reshape(text, signal) {
            return post([
                {
                    role: "system",
                    content: "Ты адаптатор английского и русского под простой русский уровня B2 для подростка. Если текст на русском — перескажи его простыми формулировками. Если на английском — переведи на такой же русский. Детали и факты сохраняй. Меняй только стиль: порядок слов и витиеватые формулировки. Мусор вроде таймингов, лишних цифр, ников и разметки убирай. Пунктуацию и оформление поправь."
                },
                { role: "user", content: shapeTask(text) }
            ], signal);
        }

        async function adapt(pack) {
            const id = (pack._id || 0) + 1;
            pack._id = id;
            if (pack._ac) pack._ac.abort();
            for (const block of pack.querySelectorAll(".block")) {
                if (block._ac) block._ac.abort();
            }
            const ac = new AbortController();
            pack._ac = ac;
            if (pack._red) clearTimeout(pack._red);
            const btn = pack.querySelector(".mid");
            btn.classList.remove("ok", "bad");
            btn.classList.add("on");
            const source = [...pack.querySelectorAll(".src")].map((node) => node.textContent).join("\n");
            // Пачка строк длиннее одной реплики, короткого ожидания строки здесь не хватает.
            const killer = setTimeout(() => ac.abort(), 120000);
            try {
                const text = await reshape(source, ac.signal);
                if (pack._id !== id) return;
                const rows = groupSentences(splitSentences(text));
                if (!rows.length) throw new Error("empty");
                fillPack(pack, rows);
                const next = pack.querySelector(".mid");
                if (next) next.classList.add("ok");
            } catch (err) {
                if (pack._id !== id) return;
                btn.classList.add("bad");
                pack._red = setTimeout(() => {
                    if (pack._id !== id) return;
                    btn.classList.remove("bad");
                }, 6000);
            } finally {
                clearTimeout(killer);
                if (pack._id === id && btn.isConnected) btn.classList.remove("on");
            }
        }

        async function send(block) {
            const id = (block._id || 0) + 1;
            block._id = id;
            if (block._ac) block._ac.abort();
            const ac = new AbortController();
            block._ac = ac;
            if (block._red) clearTimeout(block._red);
            const src = block.querySelector(".src");
            const tr = block.querySelector(".tr");
            src.classList.remove("bad");
            src.classList.add("on");
            const killer = setTimeout(() => ac.abort(), 30000);
            try {
                const text = await pull(block, ac.signal);
                if (block._id !== id) return;
                tr.textContent = text;
            } catch (err) {
                if (block._id !== id) return;
                src.classList.add("bad");
                block._red = setTimeout(() => {
                    if (block._id !== id) return;
                    src.classList.remove("bad");
                }, 6000);
            } finally {
                clearTimeout(killer);
                if (block._id === id && src.isConnected) src.classList.remove("on");
            }
        }

        document.getElementById("build").addEventListener("click", () => {
            render(groupSentences(splitSentences(box.value)));
            applySize();
        });

        document.getElementById("wipe").addEventListener("click", () => {
            box.value = "";
            list.replaceChildren();
            box.focus();
        });

        size.addEventListener("input", applySize);
        box.focus();
    </script>
</body>
</html>
